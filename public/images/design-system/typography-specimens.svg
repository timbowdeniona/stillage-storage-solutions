<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="1100" height="860">
  <!-- Background -->
  <rect width="1100" height="860" fill="#FAF5EE" />
  <rect x="20" y="20" width="1060" height="820" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="2" />

  <!-- Top Header Banner -->
  <rect x="20" y="20" width="1060" height="76" fill="#0F2342" />
  <text x="50" y="54" fill="#FFFFFF" font-family="'Barlow Condensed', 'Arial Narrow', Impact, sans-serif" font-size="24" font-weight="800" letter-spacing="1.5">STILLAGE STORAGE SOLUTIONS — TYPOGRAPHY &amp; UI SPECIMENS</text>
  <text x="50" y="76" fill="#F2E3CE" font-size="13" font-family="'JetBrains Mono', Consolas, monospace">4 Font Roles + Live Component Pairing Preview</text>

  <!-- Specimen 1: Barlow Condensed (Display & Headings) -->
  <g transform="translate(50, 120)">
    <rect width="1000" height="145" rx="4" fill="#FAF5EE" stroke="#DCE1E7" />
    <rect width="8" height="145" fill="#145DA0" />
    <text x="28" y="30" fill="#145DA0" font-family="monospace" font-size="12" font-weight="700">ROLE 1: DISPLAY &amp; SECTION HEADINGS — BARLOW CONDENSED (WEIGHTS 600, 700, 800)</text>
    <text x="28" y="74" fill="#0F2342" font-family="'Barlow Condensed', 'Arial Narrow', Impact, sans-serif" font-size="36" font-weight="800" letter-spacing="1">HEAVY-DUTY STEEL STILLAGES, CANTILEVER RACKS &amp; POST PALLETS</text>
    <text x="28" y="106" fill="#1C2026" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="22" font-weight="700" letter-spacing="0.8">ENGINEERED STORAGE CATEGORIES • DIRECT FACTORY CONFIGURATOR • CONFIGURE &amp; BUY</text>
    <text x="28" y="130" fill="#4A525D" font-family="sans-serif" font-size="12">Why chosen: High-impact industrial condensed geometry that fits long technical product titles cleanly. (Alternatives: Oswald, Chakra Petch, Space Grotesk)</text>
  </g>

  <!-- Specimen 2: Roboto Slab (Brand Emblem / Wordmark) -->
  <g transform="translate(50, 282)">
    <rect width="1000" height="125" rx="4" fill="#0F2342" />
    <rect width="8" height="125" fill="#F2E3CE" />
    <text x="28" y="28" fill="#F2E3CE" font-family="monospace" font-size="12" font-weight="700">ROLE 2: STANDALONE BRAND WORDMARK — ROBOTO SLAB (WEIGHT 700)</text>
    <text x="28" y="70" fill="#FFFFFF" font-family="'Roboto Slab', Rockwell, Georgia, serif" font-size="32" font-weight="700" letter-spacing="0.5">STILLAGE STORAGE SOLUTIONS</text>
    <text x="28" y="94" fill="#F2E3CE" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" letter-spacing="3">UK INDUSTRIAL STEEL FABRICATION  |  stillagestoragesolutions.co.uk</text>
    <text x="28" y="114" fill="#DCE1E7" font-family="sans-serif" font-size="12">Why chosen: Authoritative slab-serif construction heritage for the main brand header and footer emblem. (Alternatives: Zilla Slab, Arvo)</text>
  </g>

  <!-- Specimen 3: Inter (Body & UI Copy) -->
  <g transform="translate(50, 424)">
    <rect width="1000" height="135" rx="4" fill="#FFFFFF" stroke="#DCE1E7" />
    <rect width="8" height="135" fill="#1C2026" />
    <text x="28" y="28" fill="#145DA0" font-family="monospace" font-size="12" font-weight="700">ROLE 3: BODY COPY, DESCRIPTIONS &amp; FORM CONTROLS — INTER (WEIGHTS 400, 500, 600, 700)</text>
    <text x="28" y="58" fill="#1C2026" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">Engineered in heavy-gauge British box section steel, our 3-Bay Double-Sided Cantilever Bar Stillage provides 24 load arms.</text>
    <text x="28" y="82" fill="#4A525D" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="400">Each arm features welded upturned safety lugs to prevent round tube, scaffolding, or steel bar stock from rolling off during forklift transport.</text>
    <text x="28" y="106" fill="#1C2026" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">✓ Self-centring pressed steel pyramid stacking feet    ✓ 4-way forklift handling    ✓ Optional lockable polyurethane castors</text>
    <text x="28" y="125" fill="#4A525D" font-family="sans-serif" font-size="12">Why chosen: Neutral, ultra-legible sans-serif for dense specification paragraphs and checkout forms. (Alternatives: IBM Plex Sans, Plus Jakarta Sans)</text>
  </g>

  <!-- Specimen 4: JetBrains Mono (Technical Specs, SKUs, Dimensions & Prices) -->
  <g transform="translate(50, 576)">
    <rect width="1000" height="135" rx="4" fill="#FAF5EE" stroke="#DCE1E7" />
    <rect width="8" height="135" fill="#00897B" />
    <text x="28" y="28" fill="#00897B" font-family="monospace" font-size="12" font-weight="700">ROLE 4: TECHNICAL SPECS, SKUS, DIMENSIONS &amp; TABULAR PRICING — JETBRAINS MONO (WEIGHTS 500, 700)</text>
    <text x="28" y="64" fill="#0F2342" font-family="'JetBrains Mono', Consolas, monospace" font-size="24" font-weight="700">£385.00 Ex. VAT   |   £462.00 Inc. VAT   |   10+ Rate: £346.50</text>
    <text x="28" y="94" fill="#145DA0" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700">SKU: SSS-CANT-3B8A  •  SWL: 1,500 kg UDL  •  EXT: 2400(L) × 1100(W) × 1450(H) mm  •  80×80×4mm RHS</text>
    <text x="28" y="122" fill="#4A525D" font-family="sans-serif" font-size="12">Why chosen: Precision CAD/blueprint monospace keeps columns of millimetre dimensions, weights, and GBP figures aligned. (Alternatives: IBM Plex Mono, Space Mono)</text>
  </g>

  <!-- Bottom Live UI Button & Badge Combination Strip -->
  <g transform="translate(50, 730)">
    <text x="0" y="18" fill="#0F2342" font-family="sans-serif" font-size="13" font-weight="700">COMPONENT COMBINATION EXAMPLES:</text>

    <!-- Primary CTA Button -->
    <rect x="0" y="30" width="220" height="46" rx="3" fill="#145DA0" />
    <text x="32" y="58" fill="#FFFFFF" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="17" font-weight="700" letter-spacing="1.2">CONFIGURE &amp; BUY →</text>

    <!-- Secondary Sand Button -->
    <rect x="236" y="30" width="230" height="46" rx="3" fill="#F2E3CE" stroke="#0F2342" stroke-width="1.5" />
    <text x="262" y="58" fill="#0F2342" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="17" font-weight="700" letter-spacing="1.2">REQUEST CAD QUOTE</text>

    <!-- Navy Proforma Button -->
    <rect x="482" y="30" width="275" height="46" rx="3" fill="#0F2342" />
    <text x="506" y="58" fill="#F2E3CE" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="16" font-weight="700" letter-spacing="1">GENERATE B2B VAT PROFORMA</text>

    <!-- SWL & Bulk Badges -->
    <rect x="774" y="30" width="108" height="46" rx="3" fill="#0F2342" />
    <text x="790" y="57" fill="#F2E3CE" font-family="monospace" font-size="13" font-weight="700">1500kg SWL</text>

    <rect x="894" y="30" width="106" height="46" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" />
    <text x="910" y="57" fill="#D97706" font-family="monospace" font-size="13" font-weight="700">SAVE 10%</text>
  </g>
</svg>
