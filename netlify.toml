# Netlify Configuration for Stillage Storage Solutions (stillagestoragesolutions.co.uk)
# Next.js (App Router) + Rust Serverless APIs

[build]
  command = "npm run build && rm -rf .next/cache/fetch-cache"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  RUST_BACKTRACE = "1"
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,README.md,.env.example"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_CONTENTFUL_SPACE_ID,NEXT_PUBLIC_CONTENTFUL_ENVIRONMENT,NEXT_PUBLIC_ALGOLIA_APP_ID,NEXT_PUBLIC_ALGOLIA_SEARCH_KEY,NEXT_PUBLIC_ALGOLIA_INDEX_NAME,PUBLIC_STRIPE_PUBLISHABLE_KEY,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Route clean /api/rust/* paths to compiled Rust Lambda/Netlify functions
[[redirects]]
  from = "/api/rust/quote"
  to = "/.netlify/functions/quote"
  status = 200

[[redirects]]
  from = "/api/rust/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/rust/algolia-sync"
  to = "/.netlify/functions/algolia-sync"
  status = 200

# Security and caching headers for static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
